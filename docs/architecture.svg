<text x="1395.0" y="774" text-anchor="middle" font-size="11.5" fill="#334155">createdAt, geometry: Point</text>
<text x="1395.0" y="791" text-anchor="middle" font-size="11.5" fill="#334155">index: 2dsphere</text>

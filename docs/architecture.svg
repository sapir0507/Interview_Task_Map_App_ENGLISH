<text x="490" y="185" text-anchor="start" font-size="11.5" font-weight="600" fill="#1e293b">REST + JSON</text>
<text x="490" y="200" text-anchor="start" font-size="11.5" font-weight="600" fill="#1e293b">GeoJSON, WGS84</text>
<text x="490" y="215" text-anchor="start" font-size="11.5" font-weight="600" fill="#1e293b">[lng, lat]</text>
<text x="490" y="265" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">Vite proxy:</text>
<text x="490" y="280" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">/api to :5080</text>
<text x="490" y="295" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">(no CORS)</text>
<text x="490" y="330" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">GET /api/polygons</text>
<text x="490" y="345" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">POST /api/polygons</text>
<text x="490" y="360" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">DELETE /api/polygons</text>
<text x="490" y="375" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">GET /api/objects</text>
<text x="490" y="390" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">POST /api/objects</text>
<text x="490" y="405" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">DELETE /api/objects/{id}</text>

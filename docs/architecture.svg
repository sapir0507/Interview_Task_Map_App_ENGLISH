<rect x="1305" y="575" width="180" height="250" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="1395" y="597" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">database: taskmap</text>

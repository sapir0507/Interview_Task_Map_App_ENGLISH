<text x="1395.0" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">polygons</text>
<text x="1395.0" y="647" text-anchor="middle" font-size="11.5" fill="#334155">_id, name, createdAt</text>
<text x="1395.0" y="664" text-anchor="middle" font-size="11.5" fill="#334155">geometry: Polygon</text>
<text x="1395.0" y="681" text-anchor="middle" font-size="11.5" fill="#334155">index: 2dsphere</text>
<rect x="1320" y="720" width="150" height="95" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
